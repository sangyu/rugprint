project:
  type: website
  render:
    - "*.ipynb"
    - "!00_core.ipynb"
    - "!01_tests.ipynb"
  resources:
    - "../figures/**"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    keep-md: true
  commonmark: default

website:
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
  sidebar:
    style: floating

metadata-files: [nbdev.yml, sidebar.yml]